name: Validate Agent Skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check synchronization script
        run: python -m py_compile scripts/sync-skills.py

      - name: Verify generated copies
        run: python scripts/sync-skills.py --check

      - name: Install Agent Skills validator
        run: python -m pip install skills-ref

      - name: Validate every skill package
        shell: bash
        run: |
          set -euo pipefail
          for base in canonical claude codex copilot; do
            for skill in "$base"/*/SKILL.md; do
              agentskills validate "$(dirname "$skill")"
            done
          done
